# A-priori policy inventory — vintage 2026-08-16
#
# Hand-written from the policy record BEFORE consulting the generated
# shortlist, so that the sweep can be scored against it. See the companion
# `inventory_apriori_2026-08-16.md` for the diff, the leak-risk ranking and
# the sources.
#
# date_grade:
#   A  exact day from a primary or near-primary source. Usable.
#   B  day near-certain but from secondary reporting of a primary act.
#      Confirm through events.govuk.first_publication before use.
#   C  month only. NOT usable until resolved.
#
# scheduled: true means the date was known long in advance (a commencement).
# Keep these. Per Rule 0, dropping events with no expected reaction is
# selection on the dependent variable.
#
# direction is at the POLICY level (tighten / loosen). channel_sign in
# config/exposure.yaml converts it to a firm-level sign.

