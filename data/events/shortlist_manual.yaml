# Hand curation on top of the generated shortlist.
#
# The generated shortlist is a TRIAGE list, not a finished one: the chronology
# extractor runs at roughly 77% precision and systematically under-extracts
# deferrals. This file records the two hand steps -- what was struck and what
# was added -- so both are auditable rather than being edits to a generated
# artefact that the next regeneration would silently undo.
#
# EVERY addition carries a citation to the cached briefing corpus. Nothing here
# comes from recall.

strike:
  - row: 2
    month: May 2016
    family: eco
    reason: >
      Evidence is "In simple terms a site is viable if the value generated by
      its development exceeds the cost" -- planning viability guidance, not an
      ECO instrument. Keyword collision on "obligation".
  - row: 4
    month: April 2020
    family: eco
    reason: >
      Evidence is "ECO measures installed, by obligation, by month, up to end
      April 2020" -- a statistics table caption, not an announcement.
  - row: 9
    month: December 2020
    family: epc_regime
    reason: >
      Month and content disagree: the sentence describes the Scottish
      Government introducing a standard in 2014. The December 2020 date is
      from elsewhere in the sentence. Cannot be dated as an instrument.
  - row: 14
    month: June 2022
    family: future_homes
    reason: >
      Evidence is "Table 4: Recent updates to energy efficiency requirements"
      -- a table caption. The underlying updates may each be events; the
      caption is not one.
  - row: 18
    month: July 2024
    family: boiler_phase_out
    reason: >
      Evidence is "Housing and net zero 13 Commons Library Research Briefing,
      8 July 2024" -- a running page header. July 2024 is the briefing's own
      publication date, not a policy date.

# Deferrals and instruments the extractor missed, from `make audit`.
# `direction` here is proposed on the same rule as the generated rows and is
# still the curator's to confirm.
add:
  - id: sep2023-mees-epc-c-scrapped
    month: September 2023
    family: mees_domestic
    stage: target_change
    direction: loosen
    channel_targets: [residential_stock]
    evidence: >
      Scrapping proposals to require landlords to meet EPC C from 2025 in
      privately rented homes.
    citation: CBP-8830 p.14
    note: >
      The LANDLORD-CHANNEL half of the September 2023 announcement. The
      generated shortlist carried September 2023 only as a boiler event, so
      the residential_stock channel -- the cleanest landlord-capex channel in
      the study -- was missing from the single most valuable event. Same
      announcement as `sep2023-boiler-phaseout-delayed`; the two share an
      event and must be one row with two channel targets, not two events.

  - id: sep2023-boiler-phaseout-delayed
    month: September 2023
    family: boiler_phase_out
    stage: target_change
    direction: loosen
    channel_targets: [product_revenue]
    evidence: >
      In September 2023 the Prime Minister announced a number of changes to
      net zero policy including that the phase out date for installing new oil
      and LPG boilers and new coal heating for off-grid homes would be put
      back to 2035.
    citation: CBP-9838 p.6
    note: Merge with sep2023-mees-epc-c-scrapped into one event.

  - id: sep2023-boiler-exemptions
    month: September 2023
    family: boiler_phase_out
    stage: target_change
    direction: loosen
    channel_targets: [product_revenue]
    evidence: >
      Exempting some homes, such as off-gas-grid homes, from the requirement
      to phase out fossil fuel boilers (previously set for 2035).
    citation: CBP-8830 p.14
    note: Third strand of the same September 2023 announcement. Merge.

  - id: mar2024-chmm-delayed
    month: March 2024
    family: boiler_upgrade
    stage: target_change
    direction: loosen
    channel_targets: [product_revenue]
    evidence: >
      In March 2024, the government proposed delaying the introduction of the
      clean heat market mechanism to April 2025.
    citation: CBP-8830 p.31
    note: >
      The CHMM is the boiler manufacturers' obligation. A delay is a direct
      loosening on the product_revenue channel. Unattributed by the extractor
      because the sentence names neither a family term nor an instrument noun.

  - id: eco4-funding-stopped
    month: March 2026
    family: eco
    stage: scheme_closure
    direction: loosen
    channel_targets: [product_revenue]
    evidence: >
      The government decided to stop further funding of ECO4 through
      consumers' energy bills after March 2026, and major suppliers are either
      no longer advertising ECO4 or accepting applications.
    citation: CBP-9585 p.7

  - id: hem-delayed-2026
    month: January 2026
    family: future_homes
    stage: target_change
    direction: loosen
    channel_targets: [delivered_stock]
    evidence: >
      In early 2026 the government delayed the introduction of the HEM until
      at least three months after the launch of its Future Homes Standard.
    citation: CBP-9889 p.11
    note: >
      "Early 2026" is not a month. Needs a primary-source date before it can
      be used; flagged rather than dated by assumption.

  - id: zero-carbon-homes-cancelled
    month: July 2015
    family: future_homes
    stage: scheme_closure
    direction: loosen
    channel_targets: [delivered_stock]
    evidence: >
      The zero carbon homes policy was cancelled in 2015 by the then
      Conservative government.
    citation: CBP-8830 p.36
    note: >
      Outside the equity sample floor (2013-01) but only just, and the treated
      housebuilders were listed. Month is unverified -- the briefing says
      "2015" only. Requires a primary-source date.
